# PRODUCTION EXAMPLE, not tested against a real host yet (hosting not chosen; see docs/OPERATIONS.md).
# Put a TLS-terminating reverse proxy (Caddy/Nginx/your host's load balancer) in front of `web`.
# Secrets come from .env.production (never committed) or, better, your host's secret manager.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tiqa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: tiqa
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U tiqa"], interval: 5s, retries: 10 }
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"] # cache + rate limits only: nothing to persist
    restart: unless-stopped

  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env.production
    command: ["/app/packages/db/node_modules/.bin/prisma", "migrate", "deploy", "--schema", "/app/packages/db/prisma/schema.prisma"]
    depends_on: { postgres: { condition: service_healthy } }
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env.production
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_started } }
    restart: unless-stopped
  worker: # exactly ONE instance
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env.production
    command: ["/app/node_modules/.bin/tsx", "src/worker.ts"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    restart: unless-stopped
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile, args: { API_URL: "http://api:4000" } }
    environment: { NODE_ENV: production }
    ports: ["127.0.0.1:3000:3000"] # expose only to the reverse proxy
    depends_on: [api]
    restart: unless-stopped
volumes:
  pgdata:
