name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tiqa
          POSTGRES_PASSWORD: tiqa
          POSTGRES_DB: tiqa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tiqa" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: cp .env.example .env
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @tiqa/web build
